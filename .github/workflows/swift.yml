name: Build IPA

on:
  push:
  workflow_dispatch:

defaults:
  run:
    working-directory: Halala

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Halala.xcodeproj \
            -scheme Halala \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: unable|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/Halala.app || { grep -E "error:" build.log | head -40; tail -n 60 build.log; exit 1; }

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Halala.app Payload/
          zip -qry Halala.ipa Payload
          ls -lh Halala.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Halala-ipa
          path: Halala/Halala.ipa

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: Halala/build.log
